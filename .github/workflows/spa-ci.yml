name: spa-ci

# verify.ps1 is the LOCAL gate (see AGENTS.md): the agent runs it green before
# pushing. CI does NOT run verify.ps1 — a GitHub runner lacks the git-ignored config
# (src/devconfig.js, src/prodconfig.js) that verify needs, and a person decides the
# merge. This workflow is kept as an intentionally inert, manual-dispatch-only
# placeholder so the policy is explicit and it can be re-enabled if CI is ever
# provisioned with those inputs.

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: CI does not run verify.ps1
        run: echo "verify.ps1 is the local gate; CI does not run it. See AGENTS.md."
